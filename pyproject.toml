[project]
name = "slawatch"
version = "0.1.0"
description = "SLA-breach risk analytics for a telecom enterprise service desk, on synthetic TMF621-shaped trouble-ticket data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Arda Ulas Ozdemir" }]
# Core = what scoring needs (slawatch.model + slawatch.api). scikit-learn is pinned exactly
# because models/sla_breach.joblib is a pickle of that version; loading checks the pin.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn==1.9.1",
    "joblib>=1.4",
    "pydantic>=2.7",
    "fastapi>=0.115",
]

[project.optional-dependencies]
# Generator, pipeline and training: Postgres access and the training CLI's extras.
pipeline = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]
# The Lambda container image installs `.[lambda]` only.
lambda = [
    "mangum>=0.19",
]

[project.scripts]
slawatch-generate = "slawatch.generate:main"
slawatch-pipeline = "slawatch.pipeline:main"
slawatch-train = "slawatch.train:main"

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.0",
    "ruff>=0.6",
    "uvicorn>=0.30",
    "httpx2>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slawatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a reachable PostgreSQL (set SLAWATCH_TEST_DATABASE_URL or run docker compose)",
]
