services:
  db:
    image: postgres:16
    container_name: slawatch-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slawatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slawatch}
      POSTGRES_DB: ${POSTGRES_DB:-slawatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slawatch} -d ${POSTGRES_DB:-slawatch}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
